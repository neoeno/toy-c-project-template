name: C project CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build and run program
        run: make CC=gcc run

      - name: Build and run unit tests
        run: make CC=gcc test